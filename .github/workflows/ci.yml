name: verify-all-claims
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt
      - run: make -C csrc
      # C-перебор против каталога
      - run: ./csrc/enum 2 22 > /tmp/enum_c.csv 2> /tmp/cyc_c.txt && python scripts/check_enum.py /tmp/enum_c.csv results/enumeration.csv 22
      # Rust: портабельная сборка (без target-cpu=native), тесты и независимый прогон
      - run: RUSTFLAGS="" cargo test --release --manifest-path rsrc/Cargo.toml
      - run: RUSTFLAGS="" cargo run --release --manifest-path rsrc/Cargo.toml -- 2 22 > /tmp/enum_rs.csv 2> /tmp/enum_rs.log && python scripts/check_enum.py /tmp/enum_rs.csv results/enumeration.csv 22
      - run: cmp <(cut -d, -f1-5 /tmp/enum_c.csv) <(cut -d, -f1-5 /tmp/enum_rs.csv)
      # двоичный поиск: ИМЕННО тот, на котором число 48 231 288 в тексте
      - run: ./csrc/search_ext > /tmp/search_ext.txt && grep -q 'SYSTEMS 48231288' /tmp/search_ext.txt
      - run: pytest -q tests
      - run: python scripts/qr_phase_diagram.py && python scripts/sigma_law.py 60 && python scripts/basins.py 18
      - run: python scripts/run_all.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.34.1
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check TagT4.lean
        run: lean lean/TagT4.lean
